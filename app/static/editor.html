<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัดต่อ · ClipKit</title>
<style>
:root{--bg:#0c0f17;--card:#141824;--card2:#1b2030;--line:#262d40;--txt:#f1f4fb;--sub:#c5cde0;--mut:#828ca4;--acc:#7c5cff;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI","Leelawadee UI",system-ui,sans-serif}
main{display:grid;grid-template-rows:auto 1fr auto;height:100vh;min-width:0}
button{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
input,select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit}
.top{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:16px;margin:0 8px 0 0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,420px);gap:14px;padding:14px 16px;min-height:0}
.player{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;background:#05070c;border-radius:14px;position:relative}
.player hyperframes-player{border-radius:10px;overflow:hidden}
.player .empty{color:var(--mut);text-align:center;padding:30px}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;min-height:0}
.side h3{margin:0 0 8px;font-size:15px}.side h4{margin:16px 0 6px;font-size:13.5px;color:var(--sub)}
.hint{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{min-width:86px;color:var(--sub)}
.row input[type=range]{flex:1}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#000;padding:0;text-align:center}
.look img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover}
.look span{display:block;font-size:12px;padding:4px;color:var(--sub);background:var(--card2)}
.look.on{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.grid img:hover{border-color:var(--acc)}
/* timeline */
.tl{border-top:1px solid var(--line);background:var(--card);padding:8px 16px 12px;user-select:none}
.tlbar{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:13px;color:var(--sub)}
.tlbar .t{font-variant-numeric:tabular-nums;color:#fff;min-width:110px}
.tracks{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start}
.lab{font-size:12.5px;color:var(--sub);white-space:nowrap;height:38px;margin-top:4px;display:flex;align-items:center}
.lane{position:relative;height:38px;background:#0f131d;border-radius:8px;overflow:hidden}
.scroll{overflow-x:auto;position:relative;padding-bottom:4px}
.inner{position:relative}
.ruler{height:18px;position:relative;font-size:10.5px;color:var(--mut)}
.ruler i{position:absolute;top:0;border-left:1px solid #2a3147;height:18px;padding-left:3px;font-style:normal}
.blk{position:absolute;top:3px;bottom:3px;border-radius:6px;padding:2px 6px;font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent}
.blk.sub{background:#2b3350;color:#e6e9f5}
.blk.sub b{color:#ffb15c}
.blk.br{background:#11463a;color:#c9f7e6;display:flex;gap:4px;align-items:center}
.blk.br img{height:100%;border-radius:4px}
.blk.mo{background:#4a2a6e;color:#eadcff}
.blk.mu{background:#3a3220;color:#f3e1b5;cursor:default}
.blk.sel{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.blk .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.15)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff4d6d;pointer-events:none;z-index:5}
.busy{color:var(--warn);font-size:13px;margin-left:6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.agent{border:1px dashed var(--acc);border-radius:10px;padding:10px;margin-top:8px}
.agent code{display:block;background:#080a10;border-radius:8px;padding:8px;margin:6px 0;word-break:break-all;font-size:12.5px}
.ov{position:absolute;pointer-events:none;z-index:4;background:rgba(5,7,12,.55)}.ov[hidden]{display:none}
.ov .safe{position:absolute;border:1.5px dashed rgba(255,196,0,.85);border-radius:4px}
.ov .col{position:absolute;right:0;bottom:0;background:rgba(239,68,68,.22);border-left:1.5px dashed rgba(239,68,68,.8)}
.ov .otxt{position:absolute;text-align:center;font-weight:700;line-height:1.2;transform:translateY(-50%);font-family:"Kanit","Leelawadee UI",sans-serif;paint-order:stroke fill}
.opt{display:block;margin:5px 0;cursor:pointer}.prob{color:var(--warn);font-size:12.5px;margin:2px 0}
@media (max-width:900px){.mid{grid-template-columns:1fr}.player{min-height:300px}}
  body.simple .media { display: none !important; }
</style>
<link rel="stylesheet" href="/shell.css?v=3">
</head>
<body>
<main>
  <div class="top">
    <button onclick="location.href='/video-editor.html'">‹</button>
    <h1 id="title">กำลังโหลด…</h1>
    <button class="pri" id="bAuto" title="ถอดเสียง ตัดเงียบ ซับ ภาพประกอบ เพลง เอฟเฟกต์ ให้ครบในครั้งเดียว">⚡ ทำให้ครบ</button>
    <button id="bCover">🏷️ ปก</button>
    <button id="bExport" class="pri">🎬 ส่งออก</button>
    <button id="bCapcut" title="เกลาต่อในแอป CapCut">CapCut</button>
    <span class="busy" id="busy"></span>
  </div>
  <div class="mid">
    <div class="player" id="player"><div class="empty" id="empty">กำลังเตรียมตัวเล่น…</div>
      <hyperframes-player id="v" controls style="display:none;width:100%;height:100%"></hyperframes-player>
      <div class="ov" id="ov" hidden><div class="safe" id="osafe"></div><div class="col" id="ocol"></div><div class="otxt" id="otxt"></div></div></div>
    <div class="side" id="side"></div>
  </div>
  <div class="tl">
    <div class="tlbar"><span class="t" id="tc">0:00.0 / 0:00</span>
      <span>ซูม</span><input type="range" id="zoom" min="10" max="160" value="40" style="width:140px">
      <button id="bAddBr" class="media">+ ภาพประกอบตรงเส้นแดง</button>
      <span class="hint">คลิกชิ้นไหนเพื่อแก้ทางขวา · ลากภาพประกอบเพื่อเลื่อน ลากขอบขวาเพื่อยืด · Space เล่น/หยุด · Delete ลบ</span></div>
    <div class="tracks" id="tracks">
      <div><div style="height:18px"></div><div class="lab">ข้อความ</div><div class="lab media">ภาพประกอบ</div><div class="lab">ข้อความใหญ่</div><div class="lab media">เพลง</div></div>
      <div class="scroll" id="scroll"><div class="inner" id="inner"></div></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const PATH = new URLSearchParams(location.search).get('path');
let T = null, PL = null, SEL = null, PX = 40, MUSIC = null;
const mm = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
async function api(path, body) {
  const r = await fetch('/api/video/' + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : (j.detail && j.detail.why) || r.statusText);
  return j;
}
function say(html) { $('busy').innerHTML = html; }

fetch('/api/video/config').then(r => r.json()).then(c => document.body.classList.toggle('simple', !!c.simple)).catch(() => {});

async function load() {
  T = await api('draft/timeline?path=' + encodeURIComponent(PATH));
  $('title').textContent = T.name;
  document.title = T.name + ' · ตัดต่อ';
  PL = {broll: T.broll.map(b => ({...b})), music: {...T.music}, sfx: {...T.sfx}};
  drawTL(); side();
  live();
}
let building = null, again = false;
async function live() {
  if (building) { again = true; return; }
  const v = $('v'), at = v.currentTime || 0;
  building = api('draft/hf-build', {path: PATH}).then(r => {
    v.setAttribute('src', r.url + '?t=' + Date.now());
    v.style.display = 'block'; $('empty').style.display = 'none';
    v.addEventListener('ready', () => { try { v.seek(at); } catch {} }, {once: true});
  }).catch(e => { $('empty').style.display = ''; $('empty').textContent = '❌ ' + e.message; })
    .finally(() => { building = null; if (again) { again = false; live(); } });
  return building;
}
// one save for b-roll / music / effects (the export follows this list exactly)
async function savePL() {
  try { await api('draft/placed', {path: PATH, ...PL, broll: PL.broll.filter(b => b.file)}); say(''); live(); }
  catch (e) { say('❌ ' + e.message); }
}

// ── timeline ──
function drawTL() {
  const inner = $('inner'), dur = T.duration || 1;
  inner.style.width = Math.max(dur * PX + 40, $('scroll').clientWidth) + 'px';
  inner.innerHTML = '';
  const ruler = document.createElement('div'); ruler.className = 'ruler';
  const step = PX >= 80 ? 1 : PX >= 30 ? 2 : 5;
  for (let s = 0; s <= dur; s += step) { const i = document.createElement('i'); i.style.left = s * PX + 'px'; i.textContent = mm(s).replace(/\.\d$/, ''); ruler.appendChild(i); }
  inner.appendChild(ruler);
  const lane = () => { const l = document.createElement('div'); l.className = 'lane'; l.style.marginTop = '4px'; inner.appendChild(l); return l; };
  const lSub = lane(), lBr = lane(), lMo = lane(), lMu = lane();
  lBr.classList.add('media'); lMu.classList.add('media');
  const blk = (laneEl, cls, a, b, html, sel) => {
    const d = document.createElement('div');
    d.className = 'blk ' + cls + (SEL && SEL.key === sel.key ? ' sel' : '');
    d.style.left = a * PX + 'px'; d.style.width = Math.max(6, (b - a) * PX - 2) + 'px';
    d.innerHTML = html;
    d.onclick = e => { if (d._moved) return; SEL = sel; seek(a); drawTL(); side(); e.stopPropagation(); };
    laneEl.appendChild(d);
    return d;
  };
  T.phrases.forEach((p, i) => {
    const last = !T.phrases[i + 1] || T.phrases[i + 1].line !== p.line;
    const d = blk(lSub, 'sub', p.start, p.end, `${esc(p.lead)} <b>${esc(p.punch)}</b>${last ? '<div class="rz"></div>' : ''}`, {type: 'phrase', key: 'p' + i, i});
    dragLine(d, p);
  });
  PL.broll.forEach((b, i) => {
    const d = blk(lBr, 'br', b.start, b.start + b.dur, `${b.thumb ? `<img src="${b.thumb}">` : '🎞️'}<span>${esc(b.query || 'ไฟล์ของเรา')}</span><div class="rz"></div>`, {type: 'broll', key: 'b' + i, i});
    dragBlock(d, b);
  });
  T.motions.forEach((m, i) => blk(lMo, 'mo', m.start, m.start + m.duration, '⚡ ' + esc(m.text || ''), {type: 'motion', key: 'm' + i, i}));
  if (PL.music.file) blk(lMu, 'mu', 0, dur, '🎵 ' + esc(PL.music.file.split(/[\\/]/).pop()) + ` · ${Math.round(PL.music.volume * 100)}%`, {type: 'music', key: 'mu'});
  else blk(lMu, 'mu', 0, Math.min(dur, 6), '🎵 ไม่มีเพลง · คลิกเพื่อเลือก', {type: 'music', key: 'mu'});
  const ph = document.createElement('div'); ph.className = 'ph'; ph.id = 'ph'; inner.appendChild(ph);
  inner.onclick = e => { const r = inner.getBoundingClientRect(); seek((e.clientX - r.left) / PX); };
  tick();
}
const esc = s => String(s || '').replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;');
function dragBlock(d, b) {
  d.addEventListener('pointerdown', e => {
    const resize = e.target.classList.contains('rz'), x0 = e.clientX, s0 = b.start, d0 = b.dur;
    d.setPointerCapture(e.pointerId); d._moved = false;
    const move = ev => {
      const dt = (ev.clientX - x0) / PX;
      if (Math.abs(ev.clientX - x0) > 3) d._moved = true;
      if (resize) b.dur = Math.max(0.5, Math.min(10, +(d0 + dt).toFixed(2)));
      else b.start = Math.max(0, Math.min(T.duration - 0.5, +(s0 + dt).toFixed(2)));
      d.style.left = b.start * PX + 'px'; d.style.width = Math.max(6, b.dur * PX - 2) + 'px';
    };
    const up = () => { d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up);
      if (d._moved) { savePL(); side(); setTimeout(() => d._moved = false, 0); } };
    d.addEventListener('pointermove', move); d.addEventListener('pointerup', up);
  });
}
// a subtitle line moves as one piece (all its phrases); its last phrase's right edge sets where it ends
function dragLine(d, p) {
  d.addEventListener('pointerdown', e => {
    const sub = T.subs.find(s => s.text === p.line);
    if (!sub) return;
    const resize = e.target.classList.contains('rz'), x0 = e.clientX;
    const mates = [...document.querySelectorAll('.blk.sub')].filter((_, k) => T.phrases[k].line === p.line);
    const lefts = mates.map(m => parseFloat(m.style.left)), w0 = parseFloat(d.style.width);
    d.setPointerCapture(e.pointerId); d._moved = false;
    let dt = 0;
    const move = ev => {
      dt = (ev.clientX - x0) / PX;
      if (Math.abs(ev.clientX - x0) > 3) d._moved = true;
      if (resize) d.style.width = Math.max(6, w0 + dt * PX) + 'px';
      else mates.forEach((m, k) => m.style.left = Math.max(0, lefts[k] + dt * PX) + 'px');
    };
    const up = async () => {
      d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up);
      if (!d._moved) return;
      const start = resize ? sub.start : Math.max(0, +(sub.start + dt).toFixed(2));
      const end = resize ? Math.max(sub.start + 0.3, +(sub.end + dt).toFixed(2)) : +(sub.end + (start - sub.start)).toFixed(2);
      try { await api('draft/line-time', {path: PATH, line: p.line, start, end}); await reload(); say(''); }
      catch (err) { say('❌ ' + err.message); drawTL(); }
      setTimeout(() => d._moved = false, 0);
    };
    d.addEventListener('pointermove', move); d.addEventListener('pointerup', up);
  });
}
function seek(t) { const v = $('v'); try { v.seek(Math.max(0, t)); } catch {} placePH(t); }
function placePH(t) { const p = $('ph'); if (p) p.style.left = t * PX + 'px'; $('tc').textContent = mm(t) + ' / ' + mm(T.duration).replace(/\.\d$/, ''); }
function tick() { placePH($('v').currentTime || 0); }
(function loop() { if (T) tick(); requestAnimationFrame(loop); })();
$('zoom').oninput = e => { PX = +e.target.value; drawTL(); };

// ── right panel: the selected piece, or the whole clip's settings ──
const LOOKS = [['pair', 'ข้อความปกติ + ข้อความเน้น'], ['none', 'ซับธรรมดา'], ['pop', 'ซับเด้งเข้า'], ['karaoke', 'ไล่สีทีละคำ']];
function side() {
  const s = $('side');
  if (!SEL) return sideClip(s);
  if (SEL.type === 'phrase') return sidePhrase(s, T.phrases[SEL.i]);
  if (SEL.type === 'broll') return sideBroll(s, PL.broll[SEL.i], SEL.i);
  if (SEL.type === 'motion') return sideMotion(s, T.motions[SEL.i]);
  if (SEL.type === 'music') return sideMusic(s);
}
function back() { return '<button onclick="SEL=null;drawTL();side()">‹ ตั้งค่าทั้งคลิป</button>'; }
function sideClip(s) {
  const st = T.style || {}, c = st.color || {brightness: 0, contrast: 1, saturation: 1, warmth: 0};
  s.innerHTML = `<h3>ตั้งค่าทั้งคลิป</h3>
    <div class="row"><button id="tsave">💾 บันทึกเป็นเทมเพลต</button><span class="hint">${st.template ? 'ใช้เทมเพลต: ' + esc(st.template) + ' · ' : ''}เก็บหน้าตาคลิปนี้ไว้ใช้กับโปรเจกต์ใหม่</span></div>
    <h4>หน้าตาซับ</h4><div class="looks">${LOOKS.map(([k, t]) => `<button class="look${T.look === k ? ' on' : ''}" data-k="${k}"><img src="/looks/${k}.jpg"><span>${t}</span></button>`).join('')}</div>
    <div class="row"><label>พรีเซ็ตข้อความ</label><select id="preset" style="flex:1"></select></div>
    <div class="hint">สร้างพรีเซ็ตเองได้: บอกในแชท หรือดึงจากโปรเจกต์ CapCut ที่ตัดไว้</div>
    <h4 id="txtH">ข้อความ (ซับ)</h4>
    <div class="row"><label>ขนาด</label><input type="range" id="tSize" min="8" max="24" step="0.5"><span id="tSizeV" class="hint"></span></div>
    <div class="row"><label>ตำแหน่ง</label><input type="range" id="tY" min="-0.6" max="0.6" step="0.01"><span id="tYV" class="hint"></span></div>
    <div class="row"><label>ระยะบรรทัด</label><input type="range" id="tLh" min="0.9" max="2" step="0.05"><span id="tLhV" class="hint"></span></div>
    <div class="row"><label>เขตปลอดภัย</label><select id="tZone" style="flex:1"></select></div>
    <div class="row"><label>สี</label><input type="color" id="tColor"><label style="min-width:0">ขอบ</label><input type="range" id="tStroke" min="0" max="0.2" step="0.01"></div>
    <div class="row"><label>ซับยาวเกินจอ</label><select id="tMode" style="flex:1">${TIDY.map(([k, t]) => `<option value="${k}"${(st.tidy || 'lines') === k ? ' selected' : ''}>${t}</option>`).join('')}</select><button id="tTidy">จัดตอนนี้</button></div>
    <div class="hint" id="tModeH"></div>
    ${T.look === 'pair' ? '<div class="hint">หน้าตาซับ "ข้อความปกติ + เน้น" ใช้ขนาดและตำแหน่งจากพรีเซ็ตใน MP4 · ค่าตรงนี้ใช้กับซับแบบอื่นและโปรเจกต์ CapCut</div>' : ''}
    <div id="tProb"></div>
    <div class="row"><label><input type="checkbox" id="zc" ${st.zoomcut ? 'checked' : ''}> ตัดสลับด้วยการซูม</label><span class="hint">ซูมเข้า 8% ตรงจุดตัด</span></div>
    <h4>หัวคลิป (4 วินาทีแรก)</h4>
    ${[0, 1].map(n => `<div class="row"><input id="hk${n}" style="flex:1" placeholder="${n ? 'บรรทัด 2 (ไม่ใส่ก็ได้)' : 'บรรทัด 1 เช่น ธุรกิจสะดุด'}">
      <select id="hc${n}"><option value="white">ขาว</option><option value="orange">ส้ม</option><option value="red">แดง</option></select></div>`).join('')}
    <div class="row"><button class="pri" id="hks">บันทึกหัวคลิป</button><span class="hint">บรรทัดล่างตัวใหญ่กว่า · ลบข้อความทั้งสองบรรทัด = ไม่มีหัวคลิป</span></div>
    <h4>ตัดเนื้อหา</h4>
    <div class="row"><button id="uncut">↶ ย้อนการตัดล่าสุด</button><span class="hint">ตัดประโยคไหนออก: กดที่ข้อความบนไทม์ไลน์ แล้วกด ✂️</span></div>
    <h4>สีภาพ</h4>
    ${[['brightness', 'ความสว่าง', -0.3, 0.3, 0.01], ['contrast', 'ความคม', 0.6, 1.6, 0.01], ['saturation', 'ความสด', 0, 2, 0.01], ['warmth', 'อุณหภูมิสี (อุ่น/เย็น)', -0.3, 0.3, 0.01]]
      .map(([k, t, a, b, d]) => `<div class="row"><label>${t}</label><input type="range" data-c="${k}" min="${a}" max="${b}" step="${d}" value="${c[k] ?? (k === 'contrast' || k === 'saturation' ? 1 : 0)}"></div>`).join('')}
    <div class="row"><button id="autoC">✨ ปรับสีอัตโนมัติ</button><button id="resetC">ค่าเดิม</button></div>
    <div class="hint">ปรับอัตโนมัติ = แก้สีเพี้ยน (white balance) + ความสว่าง + ความคม</div>

  const l = TC.look, was = {size: l.size || 14, y: l.y ?? -0.44, line_h: TC.line_h, color: (l.color || '#ffffff').toLowerCase(), stroke: l.stroke ?? 0.08};
  $('tSize').value = was.size; $('tY').value = was.y; $('tLh').value = was.line_h; $('tColor').value = was.color; $('tStroke').value = was.stroke;
  $('tZone').innerHTML = Object.entries(TC.zones).map(([k, t]) => `<option value="${k}"${k === TC.zone ? ' selected' : ''}>${esc(t)}</option>`).join('');
  $('tZone').onchange = async () => {
    await api('draft/look', {path: PATH, style: {safe_zone: $('tZone').value}}); T.style.safe_zone = $('tZone').value;
    TC = await api('draft/text-check?path=' + encodeURIComponent(PATH)); showProb(TC); overlay(tVal()); await live(); if (!timer) $('ov').hidden = true;
  };
  const label = () => { $('tSizeV').textContent = $('tSize').value; $('tLhV').textContent = (+$('tLh').value).toFixed(2) + ' เท่า'; $('tYV').textContent = Math.round((1 - $('tY').value) / 2 * 100) + '% จากบน';
    $('tModeH').textContent = TIDY.find(t => t[0] === $('tMode').value)[2]; };
  const showProb = c => { $('tProb').innerHTML = probs(c); };
  label(); showProb(TC);
  let timer = null;
  ['tSize', 'tY', 'tLh', 'tColor', 'tStroke'].forEach(id => {
    $(id).oninput = () => { label(); overlay(tVal()); clearTimeout(timer); timer = setTimeout(save, 500); };
  });
  async function save() {
    const now = tVal(), style = Object.fromEntries(Object.entries(now).filter(([k, v]) => v !== was[k]));  // only what changed: emphasised lines keep their colour
    timer = null;
    if (!Object.keys(style).length) return;
    try {
      await api('draft/style', {path: PATH, ...style}); Object.assign(was, style);
      TC = await api('draft/text-check?path=' + encodeURIComponent(PATH)); showProb(TC);
      await live();
      if (!timer) $('ov').hidden = true;  // the rebuilt preview now shows the real thing
    } catch (e) { $('tProb').innerHTML = '<div class="prob">❌ ' + esc(e.message) + '</div>'; }
  }
  $('tMode').onchange = async () => { label(); await api('draft/look', {path: PATH, style: {tidy: $('tMode').value}}); T.style.tidy = $('tMode').value; };
  $('tTidy').onclick = async () => {
    try {
      const r = await api('draft/tidy', {path: PATH, mode: $('tMode').value});
      say(`จัดซับแล้ว: 2 บรรทัด ${r.two_lines} · แยกใหม่ ${r.split} · ย่อ ${r.shrunk} · ย้ายคำเชื่อม ${r.moved_words}`);
      await reload(); live();
    } catch (e) { say('❌ ' + e.message); }
  };
}
// before an export: long lines tidied the chosen way, then a last look at lines outside the safe zone
async function checkText(label) {
  const c = await api('draft/text-check?path=' + encodeURIComponent(PATH));
  if (!c.look) return true;
  await api('draft/tidy', {path: PATH, mode: (T.style || {}).tidy || 'lines'});
  const c2 = await api('draft/text-check?path=' + encodeURIComponent(PATH));
  if (!c2.problems.length || confirm(`ยังมี ${c2.problems.length} บรรทัดโดนปุ่มหรือแคปชันของแอป\n\n${c2.problems.slice(0, 5).map(p => p.replace(/[a-z][a-z /]+[a-z]/g, w => WHERE[w] || w)).join('\n')}\n\nกด OK เพื่อ${label}ต่อ · Cancel เพื่อไปแก้ที่ ตั้งค่าทั้งคลิป > ข้อความ`)) return true;
  SEL = null; drawTL(); side(); setTimeout(() => $('txtH') && $('txtH').scrollIntoView({behavior: 'smooth'}), 300);
  return false;
}
$('bExport').onclick = () => run($('bExport'), 'กำลังส่งออกตัวจริง…', async () => {
  if (!await checkText('ส่งออก MP4')) return say('');
  const r = await api('draft/hf-export', {path: PATH}); say('✅ ได้ไฟล์แล้ว (' + r.seconds + ' วิ): ' + esc(r.file));
});
$('bCapcut').onclick = () => run($('bCapcut'), 'กำลังจัดซับก่อนเปิดใน CapCut…', async () => {
  if (!await checkText('เปิดใน CapCut')) return say('');
  await fetch('/api/kit/draft-open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: PATH})}); say('');
});
$('bCover').onclick = () => { SEL = null; drawTL(); side(); $('coverH').scrollIntoView({behavior: 'smooth'}); };
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.key === ' ') { e.preventDefault(); const v = $('v'); v.paused ? v.play() : v.pause(); }
  if (e.key === 'Delete') del();
  if (SEL && SEL.type === 'broll' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const b = PL.broll[SEL.i]; b.start = Math.max(0, +(b.start + (e.key === 'ArrowLeft' ? -0.1 : 0.1)).toFixed(2)); drawTL(); clearTimeout(window._sv); window._sv = setTimeout(savePL, 400);
  }
});
if (!PATH) $('title').textContent = 'ไม่ได้ระบุโปรเจกต์'; else load().catch(e => say('❌ ' + e.message));
</script>
